name: Tasks

on: [push, pull_request]

jobs:
  lint-php:
    name: "php: ${{ matrix.php }} TYPO3: ${{ matrix.typo3 }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: [ '82', '83', '84', '85' ]
        typo3: [ '12', '13' ]
    container:
      image: ghcr.io/typo3/core-testing-php${{ matrix.php }}:latest
    env:
      COMPOSER_AUTH: ${{ secrets.TYPO3_ELTS_COMPOSER_AUTH }}
    steps:
      - name: Install dependencies
        run: apk add --no-cache nodejs gpg
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: ~/.composer/cache/files
          key: ${{ runner.os }}-${{ matrix.php }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.php }}-composer-
      - name: Install the security-fixed SVG sanitizer in CI
        run: |
          alias=0.22.99
          if [ "${{ matrix.typo3 }}" = "11" ]; then alias=0.18.99; fi
          composer require "enshrined/svg-sanitize:1.0.0 as $alias" --dev --no-update --sort-packages --no-interaction
      - name: Configure TYPO3 ELTS when an authorized test license is available
        if: (matrix.typo3 == '11' || matrix.typo3 == '12') && vars.TYPO3_ELTS_REPOSITORY_URL != ''
        env:
          TYPO3_ELTS_REPOSITORY_URL: ${{ vars.TYPO3_ELTS_REPOSITORY_URL }}
        run: composer config --global repositories.typo3-elts composer "$TYPO3_ELTS_REPOSITORY_URL"
      - run: composer update --with typo3/minimal="^${{ matrix.typo3 }}" --no-interaction --no-progress -W --dev
      - run: git config --global --add safe.directory $GITHUB_WORKSPACE
      - run: bash tests/typo3-svg-sanitizer.sh
      - name: Run all static checks
        shell: bash
        run: |
          set -o pipefail
          ./vendor/bin/grumphp run --no-ansi --no-interaction 2>&1 | tee /tmp/php85-grumphp.log
      - name: Report failed static checks
        if: failure()
        run: |
          if [ -f /tmp/php85-grumphp.log ]; then
            php -r '$s=file_get_contents("/tmp/php85-grumphp.log"); echo "::error::".str_replace(["%", "\r", "\n"], ["%25", "%0D", "%0A"], substr($s, -5000))."\n";'
          fi
      - run: composer test
      - name: Upload coverage reports to Codecov
        if: ${{ env.CODECOV_TOKEN != '' }}
        uses: codecov/codecov-action@v5
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          slug: andersundsehr/ssi_include
  ter-release:
    name: TER release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    needs: [ lint-php ]
    env:
      TYPO3_EXTENSION_KEY: 'ssi_include'
      REPOSITORY_URL: 'https://github.com/andersundsehr/ssi_include'
      TYPO3_API_TOKEN: ${{ secrets.TYPO3_API_TOKEN }}
      TYPO3_API_USERNAME: ${{ secrets.TYPO3_API_USERNAME }}
      TYPO3_API_PASSWORD: ${{ secrets.TYPO3_API_PASSWORD }}

    steps:
      - uses: actions/checkout@v6
      - name: Get the version
        id: get_version
        run: echo ::set-output name=VERSION::${GITHUB_REF/refs\/tags\//}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: intl, mbstring, xml, soap, zip, curl
          tools: composer

      - name: Install typo3/tailor
        run: composer global require typo3/tailor --prefer-dist --no-progress

      - name: Upload EXT:ssi_include to TER
        run: |
          sed -i 's/InstalledVersions::getPrettyVersion('\''andersundsehr\/ssi-include'\'')/'\''${{ steps.get_version.outputs.VERSION }}'\''/g' ext_emconf.php \
          && git config --global user.email "no@one" \
          && git config --global user.name "No One" \
          && git add ext_emconf.php \
          && jq '.require = .["ter-require"]' composer.json > composer.json_tmp \
          && mv composer.json_tmp composer.json \
          && composer i --no-dev \
          && git add vendor -f \
          && git commit -m 'x' -n \
          && git archive -o archive.zip HEAD --prefix=ssi_include-${{ steps.get_version.outputs.VERSION }}/ \
          && git reset --hard HEAD~ \
          && curl -H "Accept: application/vnd.github.v3+json" https://api.github.com/repos/andersundsehr/ssi_include/releases/tags/${{ steps.get_version.outputs.VERSION }} > release.json \
          && php ~/.composer/vendor/bin/tailor ter:publish ${{ steps.get_version.outputs.VERSION }} --artefact=archive.zip \
          --comment="$(cat release.json | jq -r '.name')

          $(cat release.json | jq -r '.body')

          $(cat release.json | jq -r '.html_url')"
